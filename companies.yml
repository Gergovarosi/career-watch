# ===========================================================================
# SZŰRŐK
# A pozíció CÍMÉN + HELYSZÍNÉN dolgoznak, kisbetűsítve, részleges egyezéssel.
# ===========================================================================
filters:
  # Csak akkor jelez, ha LEGALÁBB EGY illeszkedik. Üresen = minden átmegy.
  include_keywords:
    - analyst
    - analyst:in
    - praktikum
    - internship
    - intern
    - trainee
    - graduate
    - junior
    - einsteiger
    - werkstudent
    - masterarbeit
    - associate
    - relationship manager
    - client advisor
    - client service
    - kundenberater
    - wealth
    - vermögens
    - private bank
    - portfolio
    - asset management
    - investment
    - research
    - product specialist
    - rfp
    - fixed income
    - equity
    - markets
    - treasury

  # Ha BÁRMELYIK illeszkedik, kiesik. Ez a zajszűrő.
  exclude_keywords:
    - senior
    - "lead "
    - head of
    - director
    - "vice president"
    - "managing director"
    - "md,"
    - "team head"
    - executive
    - leiter
    - principal
    - lehrstelle
    - apprentice
    # nem pénzügyi zaj a nagy portálokon:
    - software
    - engineer
    - developer
    - cloud
    - cyber
    - devops

  # Svájci helyszínek. A nagy portálok kiírják az országot/várost.
  # (Ha egy adapter nem talál helyszínt, a szűrő átengedi, hogy ne veszíts pozíciót.)
  locations:
    - switzerland
    - schweiz
    - suisse
    - svizzera
    - zurich
    - zürich
    - zuerich
    - geneva
    - genève
    - genf
    - basel
    - basle
    - bern
    - berne
    - lausanne
    - lugano
    - zug
    - winterthur
    - st. gallen
    - st gallen
    - pfäffikon
    - schwyz
    - luzern
    - lucerne
    - gland
    - nyon
    - vevey
    - montreux
    - fribourg
    - freiburg
    - sion
    - chur
    - aarau
    - schaffhausen
    - thun
    - biel
    - neuchâtel
    - neuchatel
    - olten
    - solothurn
    - baden
    - frauenfeld
    - kreuzlingen
    - vaduz          # Liechtenstein (LGT, LLB) — töröld, ha nem kell
    - liechtenstein
    # (a "CH" országkódot a program magától felismeri, pl. "Gland, CH")

